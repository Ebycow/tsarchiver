<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="5">
  <title>tsarchiver</title>
  <style>
    body { font-family: sans-serif; margin: 0; background: #f5f5f5; color: #222; }
    header { background: #1a1a2e; color: #fff; padding: 12px 24px; display: flex; align-items: center; gap: 24px; }
    header h1 { margin: 0; font-size: 1.2rem; letter-spacing: 0.05em; }
    nav a { color: #aac; text-decoration: none; font-size: 0.95rem; }
    nav a:hover { color: #fff; }
    main { padding: 24px; max-width: 1100px; margin: 0 auto; }
    .card { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.1); padding: 20px; margin-bottom: 16px; }
    .card h2 { margin: 0 0 12px; font-size: 1rem; color: #555; text-transform: uppercase; letter-spacing: 0.05em; }
    .counts { display: flex; gap: 16px; flex-wrap: wrap; }
    .count-box { flex: 1; min-width: 120px; text-align: center; padding: 16px; border-radius: 8px; }
    .count-box .num { font-size: 2rem; font-weight: bold; }
    .count-box .label { font-size: 0.8rem; color: #666; margin-top: 4px; }
    .pending  { background: #e3f2fd; }
    .processing { background: #fff3e0; }
    .done     { background: #e8f5e9; }
    .failed   { background: #fce4ec; }
    .step-list { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .step { padding: 4px 12px; border-radius: 12px; font-size: 0.85rem; font-weight: 500; }
    .step-done    { background: #c8e6c9; color: #2e7d32; }
    .step-running { background: #fff9c4; color: #f57f17; }
    .step-pending { background: #eeeeee; color: #888; }
    .step-error   { background: #ffcdd2; color: #c62828; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th { text-align: left; padding: 8px 12px; border-bottom: 2px solid #eee; color: #555; font-weight: 600; }
    td { padding: 8px 12px; border-bottom: 1px solid #f0f0f0; }
    tr:hover td { background: #fafafa; }
    a { color: #1565c0; }
    .tag { display: inline-block; background: #e0e0e0; border-radius: 4px; padding: 1px 6px; font-size: 0.78rem; margin-right: 2px; }
    .error-box { background: #fff8f8; border: 1px solid #ffcdd2; border-radius: 6px; padding: 12px; font-family: monospace; font-size: 0.82rem; white-space: pre-wrap; overflow-x: auto; }
    .mono { font-family: monospace; font-size: 0.85rem; }
  </style>
</head>
<body>
<header>
  <h1>tsarchiver</h1>
  <nav>
    <a href="/">ダッシュボード</a> &nbsp;·&nbsp;
    <a href="/jobs">ジョブ一覧</a>
  </nav>
</header>
<main>
  {% block content %}{% endblock %}
</main>
</body>
</html>
